<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Alex Candidate Scorer</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>C++ Application Scorer</h1>
        <p>EGYM sourcing helper</p>
      </div>
      <button id="analyze">Analyze</button>
    </div>

    <div id="status" class="status">Open a LinkedIn profile and click Analyze.</div>

    <section id="result" class="hidden">
      <div class="scoreRow">
        <div id="score" class="score">--</div>
        <div>
          <div id="decision" class="decision"></div>
          <div id="summary" class="summary"></div>
        </div>
      </div>
      <div id="criteria"></div>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
